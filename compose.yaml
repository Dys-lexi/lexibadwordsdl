services:
  haste:
    build:
      context: ./haste/
      dockerfile: Dockerfile
    ports:
      - "${PORT:-80}:80"
    environment:
      BIND_ADDR: "0.0.0.0:80"
      MAX_DOWNLOAD_BYTES: "${MAX_DOWNLOAD_BYTES:-536870912}"
      MAX_DOWNLOAD_SPEED:  "${MAX_DOWNLOAD_SPEED:-0}"
      MAX_DEMO_BYTES: "${MAX_DEMO_BYTES:-2147483648}"
      MAX_CONCURRENT_REQUESTS: "${MAX_CONCURRENT_REQUESTS:-1}"
      DOWNLOAD_READ_TIMEOUT_SECONDS: "${DOWNLOAD_READ_TIMEOUT_SECONDS:-30}"
      ALLOWED_REPLAY_HOSTS: "${ALLOWED_REPLAY_HOSTS:-}"
    mem_limit: "${MEMORY_LIMIT:-4g}"
    restart: unless-stopped
    init: true
    read_only: true
    # volumes:
    #   - ./haste/:/app/haste:ro
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
  lexifrontdl:
    build:
      context: ../tfstuff/sveltelexi
      dockerfile: ./dockerfile
      args:
        VITE_API_URL: http://search:3440                                                                                                                                                                                                                    
    # depends_on:                                                                                                                                                                                                                                   
    #   - search         
    ports:
      - 5435:3000                                                                                                                                                                                                                                                                                                                                                                                                                                                       
    restart: unless-stopped
  postgres:
    image: postgres:17
    container_name: deadlockdb
    shm_size: '4gb'
    command:
      - "postgres"
      - "-c"
      - "max_connections=2000"
      - "-c"
      - "max_parallel_workers_per_gather=3"
      - "-c"
      - "max_parallel_workers=6"
      - "-c"
      - "max_worker_processes=16"
      - "-c"
      - "parallel_setup_cost=100"
      - "-c"
      - "parallel_tuple_cost=0.01"
      - "-c"
      - "min_parallel_table_scan_size=8MB"
      - "-c"
      - "shared_buffers=2GB"  # Adjust based on available RAM
      - "-c"
      - "work_mem=256MB"      # Helps with large sorts/regex
      - "-c"
      - "maintenance_work_mem=1GB"  # Helps with index creation
    environment:
      POSTGRES_USER: pguserm
      POSTGRES_PASSWORD: hiddenpassword
      POSTGRES_DB: realdb
      PGPORT: 3452
    ports:
      - "3449:3452"
    volumes:
      # - /mnt/bigdrives/tflogs/db:/var/lib/postgresql/data
      - ./db:/var/lib/postgresql/data
      # - /mnt/bigdrives/tflogs/logs.sql:/var/logs.sql
      # - ./dump:/var/bvmountIonlyhavelike7terrabytesofstoragepleasebekindtomethankyouloveyou
    restart: unless-stopped
  update:
    build:
      context: ./
      dockerfile: ./dockerfile
    depends_on:
        postgres:
          condition: service_started
    volumes:
      # - ./fonts:/app/fonts:ro
      # - ./search.py:/app/search.py:ro
      # - ./tempurature.py:/app/tempurature.py:ro
      - ./test_api.py:/app/test_api.py:ro
      - ./initsql.py:/app/initsql.py:ro
      # - ./statscache.json:/app/statscache.json:rw
      # - ./slurcloud.py:/app/slurcloud.py:ro
      # - ./chatfilters:/app/chatfilters:ro
      # - ./wordcloud:/app/wordcloud:ro
    # env_file:
      # - ./.env
    restart: unless-stopped
